# Loading metadata for Fox's Foxtail.
# Gradle fills in placeholder values from gradle.properties when building the mod.
# The completed file is packaged as META-INF/neoforge.mods.toml in the JAR.

# License displayed in the Mods menu, supplied by gradle.properties.
license="${mod_license}"

# Optional issue tracker; replace the placeholder before enabling.
#issueTrackerURL="https://change.me.to.your.issue.tracker.example.invalid/" #optional

# Identity and display information for Fox's Foxtail.
[[mods]] #mandatory

# Must match the @Mod ID and the assets namespace in the source code.
modId="${mod_id}" #mandatory

# Release version supplied by gradle.properties.
version="${mod_version}" #mandatory

# Name shown in the Mods menu.
displayName="${mod_name}" #mandatory

# Optional update checker; requires a published NeoForge update JSON file.
#updateJSONURL="https://change.me.example.invalid/updates.json" #optional

# Optional project homepage; replace the placeholder before enabling.
#displayURL="https://change.me.to.your.mods.homepage.example.invalid/" #optional

# Optional logo; replace the placeholder with an image packaged at the JAR root.
#logoFile="logo.png" #optional

# Optional credits shown in the Mods menu.
#credits="" #optional

# Optional author information from gradle.properties; currently disabled.
#authors="${mod_author}"

# Description supplied by gradle.properties.
description='''
${mod_description}
'''

# Optional mixin registration; enable only if the mod adds a mixin config.
#[[mixins]]
#config="${mod_id}.mixins.json"

# Optional explicit access-transformer location; currently unused.
#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"

# NeoForge is required to load Fox's Foxtail.
[[dependencies.${mod_id}]] #optional
    # Loader dependency ID.
    modId="neoforge" #mandatory
    # Loading requires this dependency to be present.
    type="required" #mandatory
    # Optional explanation for the dependency.
    # reason="..."
    # Accept the configured NeoForge version or newer; compatibility still needs testing.
    versionRange="[${neo_version},)" #mandatory
    # No additional loading order is requested.
    ordering="NONE"
    # Check this dependency on both sides; rendering remains client-side code.
    side="BOTH"

# Minecraft versions accepted by Fox's Foxtail.
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    # Uses the configured range; [26.1.2] accepts only that exact version.
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional graphics requirement; disabled, so no extra OpenGL constraint is declared here.
#[features.${mod_id}]
#openGLVersion="[3.2,)"
